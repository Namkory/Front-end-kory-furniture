<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#30b5b2" />

    <!-- SEO cơ bản: title/description mặc định, từng trang sẽ cập nhật lại bằng usePageMeta (src/util/seo.js) -->
    <title>Kory Furniture</title>
    <meta
      name="description"
      content="Kory Furniture chuyên cung cấp nội thất phòng ngủ: giường ngủ, giường tầng, nệm, chăn ga gối và phụ kiện cao cấp. Thiết kế hiện đại, giá tốt, giao hàng tận nơi."
    />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Kory Furniture" />

    <!-- Open Graph / chia sẻ mạng xã hội (Facebook, Zalo...) -->
    <meta property="og:site_name" content="Kory Furniture" />
    <meta property="og:locale" content="vi_VN" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Kory Furniture" />
    <meta
      property="og:description"
      content="Kory Furniture chuyên cung cấp nội thất phòng ngủ: giường ngủ, giường tầng, nệm, chăn ga gối và phụ kiện cao cấp. Thiết kế hiện đại, giá tốt, giao hàng tận nơi."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Icon -->
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="%PUBLIC_URL%/logo192.png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
  </head>
  <body>
    <noscript>Vui lòng bật JavaScript để sử dụng website Kory Furniture.</noscript>
    <div id="root"></div>
  </body>
</html>
